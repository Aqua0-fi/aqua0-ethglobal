specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: VaultFactory
    network: base
    source:
      address: "0xc914b9B607F50e153cc1E4a7633f3233B4e57874"
      abi: VaultFactory
      startBlock: 50654875
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultCreatedEvent
      abis:
        - name: VaultFactory
          file: ./abis/VaultFactory.json
        - name: AssetVault
          file: ./abis/AssetVault.json
        - name: Events
          file: ./abis/Events.json
      eventHandlers:
        - event: VaultCreated(indexed address,indexed address,string,string)
          handler: handleVaultCreated
      file: ./src/vault-factory.ts
  - kind: ethereum/contract
    name: VaultRegistry
    network: base
    source:
      address: "0xd3AdBaFb6C59614C6F6a46F1E7346b9629Dd847C"
      abi: VaultRegistry
      startBlock: 50654875
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Strategy
        - VaultRegisteredEvent
        - VaultDeregisteredEvent
      abis:
        - name: VaultRegistry
          file: ./abis/VaultRegistry.json
        - name: AssetVault
          file: ./abis/AssetVault.json
      eventHandlers:
        - event: StrategyClassRegistered(indexed bytes32,indexed uint256)
          handler: handleStrategyClassRegistered
        - event: VaultRegistered(indexed address,indexed address)
          handler: handleVaultRegistered
        - event: VaultDeregistered(indexed address,indexed address)
          handler: handleVaultDeregistered
      file: ./src/vault-registry.ts
  - kind: ethereum/contract
    name: Composer
    network: base
    source:
      address: "0x3c6CDc78aB654CaD25873C9eFe9dEDa934Bf9769"
      abi: Composer
      startBlock: 50654875
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ComposerExecutedEvent
        - FrontLifecycleEvent
      abis:
        - name: Composer
          file: ./abis/Composer.json
      eventHandlers:
        - event: ComposerExecuted(indexed address,indexed address,uint8,uint256,int256,uint256)
          handler: handleComposerExecuted
      file: ./src/composer.ts
  - kind: ethereum/contract
    name: FillerRegistry
    network: base
    source:
      address: "0x0fc6198ea9280A6568CACd4586C864f03505cb89"
      abi: FillerRegistry
      startBlock: 50654875
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FillerParticipant
        - FillerParticipationSetEvent
      abis:
        - name: FillerRegistry
          file: ./abis/FillerRegistry.json
      eventHandlers:
        - event: FillerParticipationSet(indexed address,bool,uint256)
          handler: handleFillerParticipationSet
      file: ./src/filler-registry.ts
  - kind: ethereum/contract
    name: AquaAdapter
    network: base
    source:
      address: "0x1a09f7d9B921C93F8fCD4bF04fe448982a3388Ec"
      abi: AquaAdapter
      startBlock: 50654875
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AquaStrategyShippedEvent
        - AquaStrategyDockedEvent
        - AquaStrategyReshippedEvent
        - AquaStrategyReconciledEvent
      abis:
        - name: AquaAdapter
          file: ./abis/AquaAdapter.json
      eventHandlers:
        - event: AdapterStrategyShipped(indexed address,indexed bytes32,address[],uint256[])
          handler: handleAdapterStrategyShipped
        - event: AdapterStrategyDocked(indexed address,indexed bytes32,bytes32)
          handler: handleAdapterStrategyDocked
        - event: AdapterStrategyEmergencyDocked(indexed address,indexed bytes32,bytes32)
          handler: handleAdapterStrategyEmergencyDocked
        - event: AdapterStrategyReshipped(indexed address,indexed bytes32,bytes32,bytes32,uint256[])
          handler: handleAdapterStrategyReshipped
        - event: AdapterStrategyReconciled(indexed address,indexed bytes32,address[],uint256[],uint256[])
          handler: handleAdapterStrategyReconciled
        - event: AdapterStrategyForceCleared(indexed address,indexed bytes32,bytes32,bool)
          handler: handleAdapterStrategyForceCleared
      file: ./src/aqua-adapter.ts
  - kind: ethereum/contract
    name: V4Adapter
    network: base
    source:
      address: "0xACaF2945890AB6caea62bDa459d1922532A500C8"
      abi: V4Adapter
      startBlock: 50654875
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - V4SwapSettledEvent
      abis:
        - name: V4Adapter
          file: ./abis/V4Adapter.json
      eventHandlers:
        - event: V4SwapSettled(indexed address,indexed uint256,indexed bytes32,address,int256,address,int256)
          handler: handleV4SwapSettled
      file: ./src/v4-adapter.ts
templates:
  - kind: ethereum/contract
    name: AssetVault
    network: base
    source:
      abi: Events
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
        - LPVaultPosition
        - Strategy
        - StrategyVault
        - LPStrategyPosition
      abis:
        - name: Events
          file: ./abis/Events.json
        - name: AssetVault
          file: ./abis/AssetVault.json
      eventHandlers:
        - event: VaultDeposit(indexed address,indexed address,indexed address,uint256)
          handler: handleVaultDeposit
        - event: VaultWithdraw(indexed address,indexed address,indexed address,address,uint256,uint256,uint256)
          handler: handleVaultWithdraw
        - event: ClassRegistered(indexed address,indexed uint256)
          handler: handleClassRegistered
        - event: ClassStrategistSet(indexed address,indexed uint256,indexed address)
          handler: handleClassStrategistSet
        - event: ClassPaused(indexed address,indexed uint256)
          handler: handleClassPaused
        - event: ClassUnpaused(indexed address,indexed uint256)
          handler: handleClassUnpaused
        - event: ClassCapitalDeployed(indexed address,indexed uint256,indexed address,uint256)
          handler: handleClassCapitalDeployed
        - event: ClassCapitalReturned(indexed address,indexed uint256,indexed address,uint256)
          handler: handleClassCapitalReturned
        - event: ClassAdapterSettled(indexed address,indexed uint256,indexed address,int256)
          handler: handleClassAdapterSettled
        - event: ClassVenueSettled(indexed address,indexed uint256,indexed address,int256)
          handler: handleClassVenueSettled
        - event: StrategyCommitmentSet(indexed address,indexed address,indexed uint256,bool)
          handler: handleStrategyCommitmentSet
        - event: StrategyCapitalSourced(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStrategyCapitalSourced
        - event: StrategyCapitalReturned(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStrategyCapitalReturned
        - event: StrategyDeployShortfall(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStrategyDeployShortfall
        - event: StrategyReturnLoss(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStrategyReturnLoss
        - event: StrategyPrincipalSold(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStrategyPrincipalSold
        - event: StrategyFeeAccrued(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStrategyFeeAccrued
        - event: ClassPnLReported(indexed address,indexed uint256,indexed uint256,int256,uint256)
          handler: handleClassPnLReported
        - event: ClassGuardianVeto(indexed address,indexed uint256,indexed address,string)
          handler: handleClassGuardianVeto
        - event: ClassClampHit(indexed address,indexed uint256,indexed uint256,int256,int256)
          handler: handleClassClampHit
        - event: ClassReconciliationMismatch(indexed address,indexed uint256,indexed bytes32,int256,int256,int256)
          handler: handleClassReconciliationMismatch
        - event: ClassBridgeSettled(indexed address,indexed uint256,indexed bytes32,bytes32,int256,int256)
          handler: handleClassBridgeSettled
        - event: ClassSettlementRequested(indexed address,indexed uint256,indexed address,uint256,uint256,bytes32,uint64,uint64)
          handler: handleClassSettlementRequested
        - event: ClassSettlementClaimed(indexed address,indexed uint256,indexed address,uint256,uint256,bool,address)
          handler: handleClassSettlementClaimed
        - event: CompositionConverted(indexed address,indexed uint256,indexed address,uint256)
          handler: handleCompositionConverted
        - event: FrontLocked(indexed address,indexed uint256,indexed bytes32,address,uint256)
          handler: handleFrontLocked
        - event: FrontCommitted(indexed address,indexed uint256,indexed bytes32)
          handler: handleFrontCommitted
        - event: FrontReleased(indexed address,indexed uint256,indexed bytes32,uint256)
          handler: handleFrontReleased
        - event: FrontCancelled(indexed address,indexed uint256,indexed bytes32,uint256)
          handler: handleFrontCancelled
        - event: FrontAborted(indexed address,indexed uint256,indexed bytes32,uint256)
          handler: handleFrontAborted
        - event: FrontObligationOpened(indexed address,indexed uint256,indexed bytes32,address,address,uint256,uint256)
          handler: handleFrontObligationOpened
        - event: FrontObligationSettled(indexed address,indexed uint256,indexed bytes32,address,uint256,uint256)
          handler: handleFrontObligationSettled
        - event: FrontObligationAborted(indexed address,indexed uint256,indexed bytes32,address,uint256,uint256,uint256)
          handler: handleFrontObligationAborted
        - event: FrontLandingUnderpaid(indexed address,indexed uint256,indexed bytes32,uint256,uint256)
          handler: handleFrontLandingUnderpaid
        - event: FrontLandingCredited(indexed address,indexed uint256,indexed bytes32,bytes32,uint256)
          handler: handleFrontLandingCredited
        - event: FrontLandingShortfall(indexed address,indexed uint256,indexed bytes32,bytes32,uint256)
          handler: handleFrontLandingShortfall
        - event: FrontingReleaseLimitSet(indexed address,uint256)
          handler: handleFrontingReleaseLimitSet
        - event: VenueOutflowLimitSet(indexed address,uint256)
          handler: handleVenueOutflowLimitSet
        - event: SegregatedFeesReconciled(indexed address,uint256)
          handler: handleSegregatedFeesReconciled
        - event: SetBoundsUpdated(indexed address,uint256,uint256)
          handler: handleSetBoundsUpdated
        - event: SettlementRouteSet(indexed address,indexed uint256,bytes32)
          handler: handleSettlementRouteSet
        - event: StrategyPnLClaimed(indexed address,indexed uint256,indexed address,address,uint256,uint256)
          handler: handleStrategyPnLClaimed
      file: ./src/asset-vault.ts
