}

"""
Per-(vault, LP) Aqua fill totals in that vault's asset units. Id is `<vault>-<lp>`.
"""
type AquaLPVaultFillStats @entity(immutable: false) {
  id: ID!
  vault: Bytes!
  lp: Bytes!
  network: String!
  fillCount: BigInt!
  principalSold: BigInt!
  feesCredited: BigInt!
  lastFillBlock: BigInt!
  lastFillTimestamp: BigInt!
}

"""
Internal scratch row threading vault settlement logs (emitted inside the maker hooks) onto the router `Swapped`
log that follows them in the same transaction. Not meant to be queried.
"""
type AquaSwapSettlementBuffer @entity(immutable: false) {
  id: ID!
  txHash: Bytes!
  pendingPrincipalSales: [String!]!
  pendingFeeAccruals: [String!]!
  venueSettlements: [String!]!
  principalSales: [String!]!
  "Adapter address each promoted principal sale belongs to (parallel to principalSales)."
  principalSaleVenues: [String!]!
  feeAccruals: [String!]!
  "Adapter address each promoted fee accrual belongs to (parallel to feeAccruals)."
  feeAccrualVenues: [String!]!
}

