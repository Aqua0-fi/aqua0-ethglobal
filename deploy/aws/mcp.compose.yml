name: ethglobal-public

services:
  mcp:
    image: ethglobal-mcp:latest
    container_name: ethglobal-mcp
    labels:
      com.aqua0.scope: ethglobal
      com.aqua0.component: mcp
    build:
      context: ../..
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8300:3000"
    environment:
      GRAPH_ENDPOINT: ${GRAPH_ENDPOINT:-https://api.studio.thegraph.com/query/1760183/aqua-0-ethglobal-arc-testnet/version/latest}
      GRAPH_NETWORK: ${GRAPH_NETWORK:-arc-testnet}
      GRAPH_AUTH_TOKEN: ${GRAPH_AUTH_TOKEN:-}
      GRAPH_GATEWAY_API_KEY: ${GRAPH_GATEWAY_API_KEY:-}
      WRITE_RPC_URL: ${WRITE_RPC_URL:-https://rpc.testnet.arc.network}
      WRITE_CHAIN_ID: ${WRITE_CHAIN_ID:-5042002}
      VAULT_REGISTRY_ADDRESS: ${VAULT_REGISTRY_ADDRESS:-0x9E094b21C4263e0BE5BEffa0f8296B3fd982fFFf}
      MCP_WRITE_MODE: prepare
      WRITE_PRIVATE_KEY: ""
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
