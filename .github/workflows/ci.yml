name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "rithik/**"
      - "yudhishthra/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_ARC_VAULT_FACTORY: "0x879C0c90205172a8DD66afB8124994D866372FBa"
      PUBLIC_ARC_VAULT_REGISTRY: "0x9E094b21C4263e0BE5BEffa0f8296B3fd982fFFf"
      PUBLIC_ARC_COMPOSER: "0x656F28021a624aDfA0d92dDFdBb20577674aFEC7"
      PUBLIC_ARC_FILLER_REGISTRY: "0xa8e08346DD7b6809C47A920c365bCC987Ea91297"
      PUBLIC_ARC_START_BLOCK: "60613306"
      PUBLIC_ARC_AQUA_ADAPTER: "0xbF72D34b804636496c3308796908152b82624Ca5"
      PUBLIC_ARC_AQUA_ADAPTER_START_BLOCK: "61679229"
      PUBLIC_ARC_AQUA_SWAPVM_ROUTER: "0xb20bc70b485eC1352C190d26fCaB1959d219F763"
      PUBLIC_ARC_AQUA_SWAPVM_ROUTER_START_BLOCK: "61679223"
      PUBLIC_ARC_FX_AQUA_ADAPTER: "0x8236cfFDD17D7b41F41c820f5E4b7DA6d5F243D5"
      PUBLIC_ARC_FX_AQUA_ADAPTER_START_BLOCK: "61725501"
      PUBLIC_ARC_FXSWAP_ROUTER: "0xb54AE15d2372F27718f32e9f6990330cdD3edaEB"
      PUBLIC_ARC_FXSWAP_ROUTER_START_BLOCK: "61725474"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm --filter @aqua0/subgraph test:required-events
      - run: pnpm --filter @aqua0/subgraph generate:arc
      - run: pnpm --filter @aqua0/subgraph exec graph codegen subgraph.arc.yaml
      - run: pnpm --filter @aqua0/subgraph exec graph build subgraph.arc.yaml

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      # swap-vm v1.0.2 resolves its Solidity dependencies from node_modules.
      - run: npm install --no-audit --no-fund --ignore-scripts
        working-directory: packages/contracts/lib/swap-vm

      - run: forge build

      # The Arc fork test needs the public Arc RPC and a locally compiled Aqua0 AquaAdapter artifact.
      - run: forge test
        env:
          FXSWAP_SKIP_FORK: "true"
